name: wishlist-to-drive

on:
  schedule:
    # Todos os dias às 09:00 UTC (06:00 em Brasília). Expressões cron do GitHub são sempre em UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wishlist-to-drive
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar wishlist.txt a partir do secret
        env:
          WISHLIST_TXT: ${{ secrets.WISHLIST_TXT }}
        run: |
          if [ -z "$WISHLIST_TXT" ]; then
            echo "::error::Secret WISHLIST_TXT não configurado."
            exit 1
          fi
          printf '%s\n' "$WISHLIST_TXT" > wishlist.txt

      - name: Criar arquivo do token OAuth do Google Drive a partir do secret
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
        run: |
          if [ -z "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "::error::Secret GOOGLE_DRIVE_TOKEN não configurado."
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_DRIVE_TOKEN" > "$RUNNER_TEMP/google_drive_token.json"

      - name: Executar scraper e enviar ao Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_TOKEN_FILE: ${{ runner.temp }}/google_drive_token.json
        run: |
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "::error::Variável GDRIVE_FOLDER_ID não configurada."
            exit 1
          fi
          python main.py
